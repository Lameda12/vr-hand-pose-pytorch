name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-0 libsm6 libxext6 libxrender1 libgl1

      - name: Install CPU torch
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install remaining dependencies
        run: |
          # Headless OpenCV — no display server needed in CI
          pip install opencv-python-headless
          # Non-torch deps from pyproject.toml
          pip install "numpy>=1.26.0" "scipy>=1.13.0" "scikit-image>=0.24.0" "pyyaml>=6.0"
          # Dev extras
          pip install "pytest>=8.0" "pytest-cov>=5.0" "psutil>=5.9"
          # Install package itself (all deps already satisfied above)
          pip install -e . --no-deps

      - name: Lint — check imports and syntax
        run: |
          python -c "
          import src
          import src.models
          import src.tracker
          import src.demo
          import src.data
          import src.evaluate
          print('All imports OK')
          "

      - name: Run unit tests with coverage
        run: pytest tests/ -v --cov=src --cov-report=term-missing --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false

  latency-smoke:
    name: Latency smoke test (CPU)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update -q && sudo apt-get install -y --no-install-recommends \
            libglib2.0-0 libsm6 libxext6 libxrender1 libgl1

      - name: Install CPU torch
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install remaining dependencies
        run: |
          pip install opencv-python-headless
          pip install "numpy>=1.26.0" "scipy>=1.13.0" "scikit-image>=0.24.0" "pyyaml>=6.0"
          pip install "pytest>=8.0" "pytest-cov>=5.0" "psutil>=5.9"
          pip install -e . --no-deps

      - name: Run latency benchmark (lightweight backbone, 10 runs)
        run: |
          python benchmarks/latency_benchmark.py \
            --device cpu --resolution 480p --backbone lightweight --runs 10 --warmup 2

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff
        run: ruff check src/ tests/ benchmarks/ --select E,F,W --ignore E501,W291,W293
        continue-on-error: true
