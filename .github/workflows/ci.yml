name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system dependencies (OpenCV headless)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-0 libsm6 libxext6 libxrender-dev libgl1-mesa-glx

      - name: Install package (CPU torch)
        run: |
          # CPU-only torch for CI speed
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Lint — check imports and syntax
        run: python -c "import src; import src.models; import src.tracker; import src.demo; import src.data; import src.evaluate"

      - name: Run unit tests with coverage
        run: pytest tests/ -v --cov=src --cov-report=term-missing --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false

  latency-smoke:
    name: Latency smoke test (CPU)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (CPU torch)
        run: |
          sudo apt-get update -q && sudo apt-get install -y --no-install-recommends \
            libglib2.0-0 libsm6 libxext6 libxrender-dev libgl1-mesa-glx
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Run latency benchmark (lightweight backbone, 10 runs)
        run: |
          python benchmarks/latency_benchmark.py \
            --device cpu --resolution 480p --backbone lightweight --runs 10 --warmup 2

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff (no auto-fix in CI)
        run: ruff check src/ tests/ benchmarks/ --select E,F,W --ignore E501,W291,W293
        continue-on-error: true   # lint warnings don't block merge yet
