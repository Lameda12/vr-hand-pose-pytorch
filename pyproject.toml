[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "turin-hand-pose"
version = "0.1.0"
description = "Real-time egocentric hand tracking + 3D pose estimation for VR interaction"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "opencv-python>=4.10.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "scikit-image>=0.24.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "psutil>=5.9",
]
train = [
    "pytorch-lightning>=2.3",
    "wandb>=0.17",
    "albumentations>=1.4",
    "tqdm>=4.66",
]

[project.scripts]
turin-demo = "src.demo.webcam_demo:main"
turin-benchmark = "benchmarks.latency_benchmark:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "benchmarks*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "benchmarks/*"]

[tool.coverage.report]
fail_under = 80
